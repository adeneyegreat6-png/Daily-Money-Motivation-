<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>const WIDE=location.search.includes('wide');if(WIDE){const c=document.getElementById('c');c.width=1920;c.height=1080;}</script>
<script src="common.js"></script>
<script>
// ===== "Same £1,600 wage, different habits" — dark minimal style =====
const PAY=1600,SAVE=100,M=12,EV=9,BILL=400;
const T0=5.0,T1=14.6,END=15.4,MT=(T1-T0)/M,TEV=T0+(EV-0.5)*MT;
const L=WIDE?{FLOOR:800,COLX:[660,1260],BH:15,sc:0.8,head:[80,155],mon:235,tag:[300,350,400],pop:420,ev:320,lab:[70,122,156],fs:[60,24,20],
  cta:{tx:860,ty:1018,ts:30,b:[1115,990,190,56,28],bx:1210,by:1019,bs:26},disc:1062,ds:15,end:[80,152],es:62,line:[300,1620]}
 :{FLOOR:1300,COLX:[290,790],BH:28,sc:1.15,head:[250,335],mon:440,tag:[600,665,730],pop:760,ev:590,lab:[80,140,178],fs:[68,26,21],
  cta:{tx:540,ty:1640,ts:34,b:[420,1676,240,66,33],bx:540,by:1709,bs:30},disc:1530,ds:20,end:[250,325],es:62,line:[60,960]};
const {FLOOR,COLX,BH}=L;
function bundle(x,y,w,col,band){g.fillStyle=col;rr(x-w/2,y-BH+1,w,BH-2,3);g.fill();g.fillStyle='rgba(255,255,255,.25)';g.fillRect(x-w/2+4,y-BH+3,w-8,2);g.fillStyle=band;g.fillRect(x-7,y-BH+1,14,BH-2);}
function stack(x,val,col,band,glow){
  const n=val/100, full=Math.floor(n);
  if(glow&&n>0){const gr=g.createRadialGradient(x,FLOOR-n*BH/2,10,x,FLOOR-n*BH/2,140+n*6);gr.addColorStop(0,'rgba(61,220,132,.28)');gr.addColorStop(1,'rgba(61,220,132,0)');g.fillStyle=gr;g.fillRect(x-300,FLOOR-n*BH-300,600,n*BH+300);}
  for(let i=0;i<full;i++)bundle(x+(rand(i)-0.5)*4,FLOOR-i*BH,100,col,band);
  const f=n-full;if(f>0.05){g.save();g.globalAlpha=f;bundle(x,FLOOR-full*BH,100,col,band);g.restore();}
}
function wrench(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.rotate(-0.7);g.fillStyle='#ffb020';rr(-8,-10,16,80,6);g.fill();
  g.beginPath();g.arc(0,-22,22,0,7);g.fill();g.fillStyle='#060709';rr(-7,-46,14,26,3);g.fill();g.restore();}
function tag(s,x,y,a,col){if(a<=0)return;g.save();g.globalAlpha=a;g.font=`800 ${WIDE?22:26}px Inter`;const w=g.measureText(s).width+36,h=WIDE?42:48;
  g.fillStyle='#14161b';g.strokeStyle=col;g.lineWidth=2.5;rr(x-w/2,y-h/2,w,h,h/2);g.fill();g.stroke();g.restore();text(s,x,y+1,WIDE?22:26,col,{weight:800,alpha:a});}

function render(t){
  g.fillStyle='#060709';g.fillRect(0,0,W,H);
  const sp=g.createRadialGradient(W/2,FLOOR-240,50,W/2,FLOOR-240,WIDE?900:800);sp.addColorStop(0,'rgba(255,255,255,.07)');sp.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=sp;g.fillRect(0,0,W,H);
  g.fillStyle='#1c1e24';g.fillRect(L.line[0],FLOOR,L.line[1],3);
  const mF=clamp((t-T0)/(T1-T0))*M, running=t>=T0&&t<T1, ph=((t-T0)/MT)%1, done=t>=T1, hit=t>=TEV;
  const intro=clamp((t-0.6)/0.4);
  const popA=(age)=>age; 
  // ---- SPENDER (no plan) ----
  {const x=COLX[0],cx=x-66,sx=x+78;
    if(hit)stack(sx,BILL,'#c9364f','#ffb3c0');
    let face='meh',armR=0.2;
    if(running&&ph<0.5)armR=1.2;
    if(hit&&t<TEV+1.2)face='shock'; else if(hit)face='sad';
    stick(cx,FLOOR,{acc:'cap',face,armL:0.15,armR,look:1,scale:L.sc,bob:Math.sin(t*5)*2});
    tag('NO PLAN',cx,L.tag[1],clamp((t-1.2)/0.4)*(1-clamp((t-T0+0.3)/0.3)),'#ff7a90');
    tag('Spends first',cx,L.tag[2],clamp((t-1.6)/0.4)*(1-clamp((t-T0+0.3)/0.3)),'#ff7a90');
    const quiet=Math.abs(t-TEV)<1.4;
    if(running&&!quiet){pop('+£1,600',x,L.pop,ph*1.8,'#ffd23f',34);pop('ALL SPENT',x,L.pop,(ph-0.5)*1.8,'#ff4d63',34);}
    if(hit)pop('ON CREDIT CARD',x,L.pop,(t-TEV-0.3)/1.05,'#ff4d63',34);
    text(hit?'-£400':'£0',x,FLOOR+L.lab[0],L.fs[0],'#ff4d63',{alpha:intro});
    text(hit?'IN DEBT':'SAVED',x,FLOOR+L.lab[1],L.fs[1],'#ff4d63',{spacing:3,alpha:intro});
    text(hit?'Bill went on a card':'Saves what’s left (nothing)',x,FLOOR+L.lab[2],L.fs[2],'#8f95a6',{weight:700,spacing:1,alpha:intro});
  }
  // ---- SAVER (pays self first) ----
  {const x=COLX[1],cx=x-66,sx=x+78;
    const sav=t<T0?0:Math.min(mF,M)*SAVE-(hit?BILL:0);
    stack(sx,Math.max(0,sav),'#2fae63','#c8f5d8',true);
    const fa=(t-TEV)/0.6;
    if(fa>0&&fa<1){g.save();g.globalAlpha=1-fa;for(let i=0;i<4;i++)bundle(sx+(cx-120-sx)*eOut(fa),FLOOR-(i+Math.floor(sav/100))*BH-fa*120,100,'#2fae63','#c8f5d8');g.restore();}
    let face=mF>3?'happy':'meh',armR=running&&ph<0.3?0.9:0.2;
    if(hit&&t<TEV+0.8)face='shock';
    stick(cx,FLOOR,{acc:'beanie',face,armL:0.15,armR,look:-1,scale:L.sc,bob:Math.sin(t*4+1)*2});
    const tx=WIDE?x+40:x-20;
    tag('£50 auto-save on payday',tx,L.tag[0],clamp((t-1.6)/0.4)*(1-clamp((t-T0+0.3)/0.3)),'#3ddc84');
    tag('Cancel 1 unused sub: £15',tx,L.tag[1],clamp((t-2.4)/0.4)*(1-clamp((t-T0+0.3)/0.3)),'#3ddc84');
    tag('£35 less on takeaways',tx,L.tag[2],clamp((t-3.2)/0.4)*(1-clamp((t-T0+0.3)/0.3)),'#3ddc84');
    text('= £100 A MONTH',tx,L.tag[2]+(WIDE?50:70),WIDE?34:40,'#ffd23f',{alpha:clamp((t-3.8)/0.3)*(1-clamp((t-T0+0.3)/0.3))});
    if(running&&Math.abs(t-TEV)>=1.4)pop('+£100 SAVED',x,L.pop,ph*1.4,'#3ddc84',34);
    if(hit)pop('PAID FROM SAVINGS',x,L.pop,(t-TEV-0.3)/1.05,'#3ddc84',34);
    text(gbp(Math.max(0,sav)),x,FLOOR+L.lab[0],L.fs[0],'#3ddc84',{alpha:intro});
    text('SAVED',x,FLOOR+L.lab[1],L.fs[1],'#3ddc84',{spacing:3,alpha:intro});
    text(hit?'£400 bill paid · no debt':'Saves £100 first, every payday',x,FLOOR+L.lab[2],L.fs[2],'#8f95a6',{weight:700,spacing:1,alpha:intro});
  }
  // ---- the bill ----
  const ba=clamp((t-TEV+0.4)/0.3)*(1-clamp((t-TEV-1.0)/0.3));
  if(ba>0){g.save();g.globalAlpha=ba;wrench(W/2-(WIDE?150:140),L.ev,WIDE?0.8:1);g.restore();
    text('£400 CAR REPAIR',W/2+(WIDE?30:40),L.ev,WIDE?40:46,'#ffb020',{stroke:8,sc:'#060709',alpha:ba});}
  // ---- header ----
  const hA=1-clamp((t-END)/0.4);
  if(hA>0){
    text('SAME £1,600 WAGE.',W/2,L.head[0],WIDE?66:74,'#fff',{alpha:hA*clamp(t/0.4)});
    text('DIFFERENT HABITS.',W/2,L.head[1],WIDE?66:74,'#ffd23f',{alpha:hA*clamp((t-0.3)/0.4)});
    if(t>=T0-0.3){const mm=Math.max(1,Math.min(M,Math.ceil(mF)));const a=hA*clamp((t-T0+0.3)/0.3);
      text('MONTH',W/2-35,L.mon,WIDE?28:30,'#9aa0b2',{align:'right',spacing:6,alpha:a});text(String(mm),W/2-15,L.mon,WIDE?64:74,'#ffd23f',{align:'left',alpha:a});}
  }
  if(t>=END){const a=clamp((t-END-0.2)/0.4);
    text("SAVE FIRST.",W/2,L.end[0],L.es,'#fff',{alpha:a});
    text("SPEND WHAT'S LEFT.",W/2,L.end[1],L.es,'#3ddc84',{alpha:clamp((t-END-0.6)/0.4)});
    const c=clamp((t-END-1.2)/0.4),C=L.cta;
    text('Follow Daily Money Motivation',C.tx,C.ty,C.ts,'#cfd3e0',{weight:700,alpha:c});
    if(c>0){const pressed=t>END+2.4;g.save();g.globalAlpha=c;g.fillStyle=pressed?'#2a2d35':'#ffd23f';rr(...C.b);g.fill();g.restore();
      text(pressed?'Following':'Follow',C.bx,C.by,C.bs,pressed?'#fff':'#111',{alpha:c});}
    const d1='Illustration only: £1,600/month take-home pay, £100/month saved from small habits.',d2='Not financial advice.';
    if(WIDE)text(d1+' '+d2,W/2,L.disc,L.ds,'#6f7486',{weight:500,alpha:a});
    else{text(d1,W/2,L.disc,L.ds,'#6f7486',{weight:500,alpha:a});text(d2,W/2,L.disc+30,L.ds,'#6f7486',{weight:500,alpha:a});}
  }
}
window.render=render;render(0);
</script></body></html>
