<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>const WIDE=location.search.includes('wide');if(WIDE){const c=document.getElementById('c');c.width=1920;c.height=1080;}</script>
<script src="common.js"></script>
<script>
// ===== "Lifestyle Creep: Pay Rise, Still Broke" — roller-coaster style =====
// Two riders, same pay rise: take-home £2,000 -> £2,400 a month (+£400).
// KEPT LIFESTYLE: keeps spending £2,000, moves the £400 rise to savings each payday for 12 months.
// LIFESTYLE CREEP: spends the rise (bigger car payment £220, eating out £120, subscriptions £60).
// Month 13: the same £500 surprise bill hits both.
const OLD=2000,NEW=2400,RISE=NEW-OLD,MONTHS=12,BILL=500;
const CREEP=[['BIGGER CAR PAYMENT',220],['EATING OUT',120],['SUBSCRIPTIONS',60]];
const CREEPSUM=CREEP.reduce((a,c)=>a+c[1],0);
const SAVED=RISE*MONTHS, KEPT=SAVED-BILL, CREEPLEFT=(RISE-CREEPSUM)*MONTHS, OWED=BILL-CREEPLEFT;
console.log('rise',RISE,'creep',CREEPSUM,'saved',SAVED,'kept',KEPT,'creepleft',CREEPLEFT,'owed',OWED);
if(RISE!==400||CREEPSUM!==RISE||SAVED!==4800||KEPT!==4300||CREEPLEFT!==0||OWED!==500)throw new Error('numbers changed');
const MN=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
// track value at float index k (0..13). k in [12,13] is the bill drop.
function vA(k){if(k<=MONTHS)return RISE*k;return SAVED-BILL*eIn(clamp(k-MONTHS));}
function vB(k){if(k>=MONTHS)return -BILL*eIn(clamp(k-MONTHS));const f=k-Math.floor(k);
  return f<0.22?RISE*eOut(f/0.22):RISE*(1-(f-0.22)/0.78);}
const VF=[vA,vB],NPTS=MONTHS+1;

const T0=4.6,MT=0.8,T1=T0+MONTHS*MT,DROP=0.7,END=15.8; // T1=14.2
const L=WIDE?{head:[58,124],hs:54,sub:192,subfs:28,
   P:[{x0:130,x1:870,zero:770,sc:0.078,lab:262,ldy:0,col:'#3ddc84',name:'KEPT OLD LIFESTYLE',acc:'beanie'},
      {x0:1050,x1:1790,zero:640,sc:0.3,lab:262,col:'#ff5a6e',name:'LIFESTYLE CREEP',acc:'cap'}],
   lfs:28,vfs:32,vdy:38,mfs:18,cs:0.2,cart:[70,38],res:[[500,880],[1420,880]],rfs:30,r2fs:24,rdy:42,mid:[960,950],midfs:26,
   end:[[90,'WHEN PAY GOES UP, SAVE THE RISE FIRST.']],es:52,
   cta:{txt:'Subscribe for a new money habit every day',tx:735,ty:1018,ts:30,btn:[{x:1205,y:1018,w:230,h:58,on:'Subscribe',off:'Subscribed',col:'#ff2d3d',fg:'#fff',at:2.4,bell:true}],bs:26},disc:1062,ds:15}
 :{head:[250,335],hs:70,sub:440,subfs:34,
   P:[{x0:120,x1:960,zero:965,sc:0.07,lab:525,col:'#3ddc84',name:'KEPT OLD LIFESTYLE',acc:'beanie'},
      {x0:120,x1:960,zero:1290,sc:0.3,lab:1372,col:'#ff5a6e',name:'LIFESTYLE CREEP',acc:'cap'}],
   lfs:32,vfs:38,vdy:44,mfs:22,cs:0.24,cart:[84,44],res:[[540,1490],[540,1582]],rfs:36,r2fs:28,rdy:0,mid:[540,1492],midfs:34,
   end:[[250,'WHEN PAY GOES UP,'],[335,'SAVE THE RISE FIRST.']],es:70,
   cta:{txt:'Subscribe & follow Daily Money Motivation',tx:540,ty:1712,ts:36,btn:[{x:395,y:1795,w:270,h:68,on:'Subscribe',off:'Subscribed',col:'#ff2d3d',fg:'#fff',at:2.4,bell:true},{x:705,y:1795,w:230,h:68,on:'Follow',off:'Following',col:'#ffd23f',fg:'#111',at:3.0}],bs:30},disc:1630,ds:19};

function bell(x,y,s,age,a){g.save();g.globalAlpha=a;g.translate(x,y);g.rotate(Math.sin(age*18)*0.35*Math.max(0,1-age/0.9));g.fillStyle='#ffd23f';
  g.beginPath();g.moveTo(-s*0.45,s*0.3);g.quadraticCurveTo(-s*0.4,-s*0.5,0,-s*0.5);g.quadraticCurveTo(s*0.4,-s*0.5,s*0.45,s*0.3);g.closePath();g.fill();
  g.beginPath();g.arc(0,s*0.42,s*0.13,0,7);g.fill();g.restore();}
const px=(P,k)=>{const span=P.x1-P.x0,step=span/(MONTHS+0.55);return P.x0+(k<=MONTHS?k*step:MONTHS*step+0.55*(k-MONTHS)*step);};
const py=(P,v)=>P.zero-v*P.sc;
function prog(t){if(t<T0)return 0;if(t<T1)return (t-T0)/MT;return MONTHS+clamp((t-T1)/DROP);}
function bg(){g.fillStyle='#07080b';g.fillRect(0,0,W,H);
  const sp=g.createRadialGradient(W/2,H*0.42,40,W/2,H*0.42,WIDE?950:900);sp.addColorStop(0,'rgba(255,210,63,.07)');sp.addColorStop(1,'rgba(255,210,63,0)');g.fillStyle=sp;g.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){const x=rand(i)*W,y=rand(i+99)*H*0.95,tw=0.3+0.7*Math.abs(Math.sin(i));g.fillStyle=`rgba(255,255,255,${0.05+0.08*tw})`;g.fillRect(x,y,3,3);}}
function track(P,f,a,draw){
  const kmax=NPTS*draw;
  g.save();g.globalAlpha=a;g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=3;g.setLineDash([10,10]);g.beginPath();g.moveTo(P.x0-20,P.zero);g.lineTo(P.x1+10,P.zero);g.stroke();g.setLineDash([]);g.restore();
  text('£0',P.x0-30,P.zero,WIDE?20:24,'#8a90a3',{weight:800,align:'right',alpha:a});
  g.save();g.globalAlpha=a*0.55;g.strokeStyle=P.col;g.lineWidth=4;
  for(let k=0;k<=kmax+0.001&&k<=NPTS;k+=0.5){const x=px(P,k),y=py(P,f(Math.min(k,NPTS)));g.beginPath();g.moveTo(x,y);g.lineTo(x,P.zero);g.stroke();}
  g.restore();
  const pts=[];for(let k=0;k<=kmax;k+=0.02){pts.push([px(P,k),py(P,f(Math.min(k,NPTS)))]);}
  if(pts.length>1){g.save();g.globalAlpha=a;g.lineCap='round';g.lineJoin='round';
    for(const [w,c] of [[16,'#111'],[10,P.col],[3,'rgba(255,255,255,.5)']]){g.strokeStyle=c;g.lineWidth=w;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();}
    g.restore();}
  for(let m=0;m<MONTHS;m++){const x=(px(P,m)+px(P,m+1))/2,y=P.zero+28;
    text(MN[m][0],x,y,L.mfs,'#6f7486',{weight:800,alpha:a*clamp((draw*NPTS-m)/1)});}
}
function rider(P,f,t,i){
  const k=prog(t),x=px(P,k),v=f(k),y=py(P,v);
  const k2=Math.min(k+0.04,NPTS),ang=Math.atan2(py(P,f(k2))-y,px(P,k2)-x+0.001);
  const [cw,ch]=L.cart;
  let face='happy';
  if(i&&t>=T0+1.2)face='meh'; if(i&&t>=T1)face='shock';
  if(!i&&t>=T1+DROP)face='cool';
  const up=(!i&&t>=T1+DROP)||(i&&t<T0&&t>1.6);
  g.save();g.translate(x,y);g.rotate(clamp(ang,-1.2,1.2));
  stick(0,-ch*0.2,{acc:P.acc,face,armL:up?2.6:0.5,armR:up?2.6:(i&&t>=T1?2.9:0.5),scale:L.cs,spread:0.05});
  g.fillStyle=P.col;g.strokeStyle='#111';g.lineWidth=5;rr(-cw/2,-ch-6,cw,ch,10);g.fill();g.stroke();
  g.fillStyle='rgba(0,0,0,.25)';rr(-cw/2+6,-ch+4,cw-12,8,4);g.fill();
  for(const s of [-1,1]){g.fillStyle='#222';g.beginPath();g.arc(s*cw*0.3,-6,9,0,7);g.fill();g.fillStyle='#aaa';g.beginPath();g.arc(s*cw*0.3,-6,4,0,7);g.fill();}
  g.restore();
}
function render(t){
  g.clearRect(0,0,W,H);bg();
  const build=eOut(clamp((t-0.8)/2.8));
  L.P.forEach((P,i)=>{const a=clamp((t-0.6-i*0.3)/0.4),f=VF[i];
    track(P,f,a,build);
    const k=prog(t),v=f(k);
    const vs=i?(v>=0?gbp(v)+' OF THE RISE LEFT':gbp(-v)+' ON A CARD'):gbp(v)+' SAVED';
    text(P.name,P.x0-10,P.lab,L.lfs,P.col,{align:'left',stroke:7,sc:'#111',alpha:a,spacing:1});
    text(vs,P.x0-10,P.lab+L.vdy,L.vfs,v>=0?'#fff':'#ff8a96',{align:'left',stroke:8,sc:'#111',alpha:a});
    if(a>0){g.save();g.globalAlpha=a;rider(P,f,t,i);g.restore();}
  });
  const PA=L.P[0],PB=L.P[1];
  // intro: where the creep rider's £400 goes / what the saver does
  if(t>1.6&&t<T0){const out=1-clamp((t-T0+0.5)/0.4);
    const bx=WIDE?1420:540,by=WIDE?760:1470,dy=WIDE?40:50,fs=WIDE?26:34;
    CREEP.forEach(([n,v],j)=>text('+'+gbp(v)+' '+n,bx,by+j*dy,fs,'#ff8a96',{stroke:7,sc:'#111',alpha:clamp((t-1.8-j*0.7)/0.3)*out}));
    text('KEEPS SPENDING '+gbp(OLD)+', SAVES THE '+gbp(RISE),WIDE?500:540,WIDE?840:1090,WIDE?24:32,'#3ddc84',{stroke:7,sc:'#111',alpha:clamp((t-2.2)/0.4)*out});}
  for(let m=0;m<MONTHS;m++){const tt=T0+m*MT,age=(t-tt+0.05)/0.9;
    if(age>0&&age<1){pop('+'+gbp(RISE),px(PA,m+0.15),py(PA,vA(m+0.15))-(WIDE?95:110),age,'#3ddc84',WIDE?24:28);
      pop('+'+gbp(RISE),px(PB,m+0.22),py(PB,RISE)-(WIDE?90:100),age,'#ffd23f',WIDE?24:28);}}
  if(t>T0+2*MT&&t<T1){const a=clamp((t-T0-2*MT)/0.4)*(1-clamp((t-T1+0.4)/0.4));
    text('...and it’s gone by the end of the month',WIDE?(PB.x0+PB.x1)/2:540,WIDE?770:1548,WIDE?24:30,'#ff8a96',{weight:800,alpha:a});}
  if(t>=T1){const d=(t-T1)/1.6;
    pop(gbp(BILL)+' SURPRISE BILL',WIDE?(PA.x0+PA.x1)/2+60:600,WIDE?500:760,d,'#ffd23f',WIDE?30:36);
    pop(gbp(BILL)+' SURPRISE BILL',WIDE?(PB.x0+PB.x1)/2+60:600,WIDE?780:1110,d,'#ff5a6e',WIDE?30:36);}
  if(t>=T0-0.3&&t<T1){const m=Math.min(MONTHS,Math.floor(clamp((t-T0)/MT,0,MONTHS-0.001))+1),a=clamp((t-T0+0.3)/0.3)*(1-clamp((t-T1+0.3)/0.3));
    text('BOTH TAKE HOME '+gbp(NEW)+' · '+MN[m-1],L.mid[0],L.mid[1],L.midfs,'#cfd3e0',{weight:900,stroke:6,sc:'#111',alpha:a});}
  if(t>=T1+DROP){const a=clamp((t-T1-DROP)/0.3),b=clamp((t-T1-DROP-0.4)/0.3);
    if(WIDE){text('BILL PAID. '+gbp(KEPT)+' LEFT',L.res[0][0],L.res[0][1],L.rfs,'#3ddc84',{stroke:8,sc:'#111',alpha:a});
      text('Saved all '+gbp(SAVED)+' of the rise',L.res[0][0],L.res[0][1]+L.rdy,L.r2fs,'#cfd3e0',{weight:700,alpha:b});
      text('NOW OWES '+gbp(OWED),L.res[1][0],L.res[1][1],L.rfs,'#ff5a6e',{stroke:8,sc:'#111',alpha:a});
      text('Spent all '+gbp(SAVED)+' of the rise',L.res[1][0],L.res[1][1]+L.rdy,L.r2fs,'#cfd3e0',{weight:700,alpha:b});}
    else{text('KEPT: BILL PAID, '+gbp(KEPT)+' LEFT',L.res[0][0],L.res[0][1],L.rfs,'#3ddc84',{stroke:8,sc:'#111',alpha:a});
      text('CREEP: '+gbp(OWED)+' ON A CREDIT CARD',L.res[0][0],L.res[0][1]+46,L.rfs,'#ff5a6e',{stroke:8,sc:'#111',alpha:a});
      text('Same '+gbp(SAVED)+' pay rise. Only one kept it.',L.res[1][0],L.res[1][1],L.r2fs,'#cfd3e0',{weight:700,alpha:b});}}
  const hA=1-clamp((t-END)/0.4);
  if(hA>0){
    text('LIFESTYLE CREEP',W/2,L.head[0],L.hs,'#fff',{stroke:10,sc:'#111',alpha:hA*clamp(t/0.4)});
    text('PAY RISE, STILL BROKE',W/2,L.head[1],L.hs,'#ffd23f',{stroke:10,sc:'#111',alpha:hA*clamp((t-0.3)/0.4)});
    const sub=t<T0?'Take-home pay: '+gbp(OLD)+' → '+gbp(NEW)+' a month':t<T1?'Same pay rise. Two different rides.':'A pay rise only helps if you keep some of it';
    const sa=t<T0?clamp((t-1.0)/0.4)*(1-clamp((t-T0+0.3)/0.3)):t<T1?clamp((t-T0)/0.3)*(1-clamp((t-T1+0.3)/0.3)):clamp((t-T1)/0.3);
    text(sub,W/2,L.sub,L.subfs,'#9aa0b2',{weight:700,alpha:hA*sa});
  }
  if(t>=END){const a=clamp((t-END-0.2)/0.4);
    L.end.forEach(([y,s],i)=>text(s,W/2,y,L.es,i===L.end.length-1?'#3ddc84':'#fff',{stroke:10,sc:'#111',alpha:clamp((t-END-0.2-i*0.3)/0.4)}));
    const c=clamp((t-END-1.2)/0.4),C=L.cta;
    text(C.txt,C.tx,C.ty,C.ts,'#cfd3e0',{weight:700,alpha:c});
    if(c>0)for(const B of C.btn){const pressed=t>END+B.at,k=clamp((t-END-B.at)/0.15),sq=1-0.08*Math.sin(Math.PI*k);
      g.save();g.globalAlpha=c;g.translate(B.x,B.y);g.scale(sq,sq);g.fillStyle=pressed?'#2a2d35':B.col;rr(-B.w/2,-B.h/2,B.w,B.h,B.h/2);g.fill();g.restore();
      const lx=B.bell&&pressed?B.x+14:B.x;
      text(pressed?B.off:B.on,lx,B.y+1,C.bs*sq,pressed?'#fff':B.fg,{alpha:c});
      if(B.bell&&pressed)bell(B.x-B.w/2+34,B.y,C.bs*0.9,t-END-B.at,c);}
    const d1='Illustration only: example £400/month take-home pay rise, £500 bill, no interest shown.',d2='Not financial advice.';
    if(WIDE)text(d1+' '+d2,W/2,L.disc,L.ds,'#6f7486',{weight:500,alpha:a});
    else{text(d1,W/2,L.disc,L.ds,'#6f7486',{weight:500,alpha:a});text(d2,W/2,L.disc+30,L.ds,'#6f7486',{weight:500,alpha:a});}
  }
}

window.render=render;render(0);
</script></body></html>
