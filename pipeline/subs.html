<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>const WIDE=location.search.includes('wide');if(WIDE){const c=document.getElementById('c');c.width=1920;c.height=1080;}</script>
<script src="common.js"></script>
<script>
// ===== "Money Hacks: Cancel the Subscriptions You Don't Use" — dark minimal comparison =====
// Both have the same 5 subscriptions and only use one (streaming £10.99, kept by both).
// LEFT keeps paying for 4 unused ones; RIGHT does a quick audit, cancels them and keeps the money.
const KEEP=['STREAMING',10.99];
const UNUSED=[['GYM',24.99,'never goes'],['2ND STREAMING',8.99,'unwatched'],['APP TRIAL',9.99,'forgot it'],['CLOUD STORAGE',2.99,'empty']];
const MONTHLY=Math.round(UNUSED.reduce((a,b)=>a+b[1],0)*100)/100,MONTHS=12,YEAR=Math.round(MONTHLY*MONTHS*100)/100,UNIT=40;
console.log('monthly',MONTHLY,'year',YEAR);
if(MONTHLY!==46.96||YEAR!==563.52||Math.abs(UNUSED.reduce((a,b)=>a+b[1]*100,0)-4696)>1e-6)throw new Error('numbers changed');
const p2=v=>'£'+v.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const TR=[1.6,3.2,4.5,5.8,7.1],TTOT=8.6,T0=10.0,MT=0.45,T1=T0+MONTHS*MT,END=15.8; // T1=15.4
const L=WIDE?{FLOOR:800,COLX:[640,1280],BH:15,sc:0.72,head:[80,155],hs:66,sub:228,subfs:28,rows:[270,312,354,396,438,486],cfs:20,
  lab:[70,122,156],fs:[60,24,20],cta:{txt:'Subscribe & follow Daily Money Motivation',tx:640,ty:1018,ts:30,btn:[{x:1150,y:1018,w:230,h:58,on:'Subscribe',off:'Subscribed',col:'#ff2d3d',fg:'#fff',at:2.4,bell:true},{x:1400,y:1018,w:200,h:58,on:'Follow',off:'Following',col:'#ffd23f',fg:'#111',at:3.0}],bs:26},
  disc:1062,ds:15,end:[[110,'CANCEL WHAT YOU DON\'T USE.']],es:60,line:[260,1400]}
 :{FLOOR:1320,COLX:[290,790],BH:28,sc:1.15,head:[250,335],hs:74,sub:440,subfs:32,rows:[530,588,646,704,762,826],cfs:23,
  lab:[82,142,180],fs:[68,26,21],cta:{txt:'Follow Daily Money Motivation',tx:540,ty:1752,ts:38,btn:[{x:395,y:1835,w:270,h:68,on:'Subscribe',off:'Subscribed',col:'#ff2d3d',fg:'#fff',at:2.4,bell:true},{x:705,y:1835,w:230,h:68,on:'Follow',off:'Following',col:'#ffd23f',fg:'#111',at:3.0}],bs:30},
  disc:1620,ds:20,end:[[250,'CANCEL WHAT'],[335,'YOU DON\'T USE.']],es:76,line:[60,960]};
const {FLOOR,COLX,BH}=L,YEL='#ffd23f';
function bundle(x,y,w,col,band){g.fillStyle=col;rr(x-w/2,y-BH+1,w,BH-2,3);g.fill();g.fillStyle='rgba(255,255,255,.25)';g.fillRect(x-w/2+4,y-BH+3,w-8,2);g.fillStyle=band;g.fillRect(x-7,y-BH+1,14,BH-2);}
function stack(x,val,col,band,glow){
  const n=val/UNIT,full=Math.floor(n+1e-6);
  if(glow&&n>0){const gr=g.createRadialGradient(x,FLOOR-n*BH/2,10,x,FLOOR-n*BH/2,140+n*6);gr.addColorStop(0,glow);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-300,FLOOR-n*BH-300,600,n*BH+300);}
  for(let i=0;i<full;i++)bundle(x+(rand(i)-0.5)*4,FLOOR-i*BH,100,col,band);
  const f=n-full;if(f>0.05){g.save();g.globalAlpha=f;bundle(x,FLOOR-full*BH,100,col,band);g.restore();}
}
function chip(s,x,y,a,col,fill,strike){if(a<=0)return;const fs=L.cfs;g.save();g.globalAlpha=a;g.font=`800 ${fs}px Inter`;const w=g.measureText(s).width+36,h=fs*1.85;
  const sc=0.85+0.15*back(clamp(a*1.3));g.translate(x,y);g.scale(sc,sc);
  g.fillStyle=fill||'#14161b';g.strokeStyle=col;g.lineWidth=2.5;rr(-w/2,-h/2,w,h,h/2);g.fill();g.stroke();g.restore();
  text(s,x,y+1,fs*sc,fill?'#111':col,{weight:800,alpha:a});
  if(strike>0){g.save();g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=4;g.beginPath();g.moveTo(x-w/2+18,y);g.lineTo(x-w/2+18+(w-36)*eOut(clamp(strike)),y);g.stroke();g.restore();}}
function bell(x,y,s,age,a){g.save();g.globalAlpha=a;g.translate(x,y);g.rotate(Math.sin(age*18)*0.35*Math.max(0,1-age/0.9));g.fillStyle=YEL;
  g.beginPath();g.moveTo(-s*0.45,s*0.3);g.quadraticCurveTo(-s*0.4,-s*0.5,0,-s*0.5);g.quadraticCurveTo(s*0.4,-s*0.5,s*0.45,s*0.3);g.closePath();g.fill();
  g.beginPath();g.arc(0,s*0.42,s*0.13,0,7);g.fill();g.restore();}
// months elapsed (each month steps in smoothly)
function months(t){let m=0;for(let k=0;k<MONTHS;k++)m+=eOut(clamp((t-(T0+k*MT))/0.3));return m;}
function render(t){
  g.fillStyle='#060709';g.fillRect(0,0,W,H);
  const sp=g.createRadialGradient(W/2,FLOOR-240,50,W/2,FLOOR-240,WIDE?900:800);sp.addColorStop(0,'rgba(255,255,255,.07)');sp.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=sp;g.fillRect(0,0,W,H);
  g.fillStyle='#1c1e24';g.fillRect(L.line[0],FLOOR,L.line[1],3);
  const intro=clamp((t-0.6)/0.4),run=t>=T0,m=months(t),val=MONTHLY*m,k=Math.min(MONTHS,Math.floor(clamp((t-T0)/MT,0,MONTHS-0.001))+1),ph=((t-T0)/MT)%1;
  const chipOut=1-clamp((t-T0+0.3)/0.3),done=t>=T1;
  const big=v=>done?p2(YEAR):(v<0.5?'£0':gbp(v));
  // ---- LEFT: keeps paying ----
  {const x=COLX[0],cx=x-66,sx=x+78;
    stack(sx,val,'#c9364f','#ffb3c0',val>0?'rgba(255,77,99,.22)':null);
    let face='meh';if(run)face=ph<0.5?'shock':'sad';if(done)face='sad';
    stick(cx,FLOOR,{acc:'cap',face,armL:0.15,armR:0.2,look:1,scale:L.sc,bob:Math.sin(t*5)*2});
    chip(KEEP[0]+' '+p2(KEEP[1])+' · used',x,L.rows[0],clamp((t-TR[0])/0.35)*chipOut,'#cfd3e0');
    UNUSED.forEach(([n,p,why],i)=>chip(n+' '+p2(p)+' · '+why,x,L.rows[i+1],clamp((t-TR[i+1])/0.35)*chipOut,'#ff7a90'));
    chip('= '+p2(MONTHLY)+' A MONTH WASTED',x,L.rows[5],clamp((t-TTOT)/0.35)*chipOut,YEL,YEL);
    if(run&&!done)pop('-'+p2(MONTHLY),sx,FLOOR-val/UNIT*BH-(WIDE?30:44),ph*1.1,'#ff4d63',WIDE?28:36);
    text(big(val),x,FLOOR+L.lab[0],L.fs[0],'#ff4d63',{alpha:intro});
    text('WASTED',x,FLOOR+L.lab[1],L.fs[1],'#ff4d63',{spacing:3,alpha:intro});
    text(t<TTOT?'Keeps all 5. Uses 1.':'Pays for 4 things never used',x,FLOOR+L.lab[2],L.fs[2],'#8f95a6',{weight:700,spacing:1,alpha:intro});
  }
  // ---- RIGHT: audits and cancels ----
  {const x=COLX[1],cx=x-66,sx=x+78;
    stack(sx,val,'#2fae63','#c8f5d8',val>0?'rgba(61,220,132,.28)':null);
    let face='meh',armR=0.2;for(let i=1;i<5;i++)if(t>TR[i]+0.2&&t<TR[i]+0.8)armR=1.3;
    if(t>TR[1])face='happy';if(done)face='cool';
    stick(cx,FLOOR,{acc:'beanie',face,armL:0.15,armR,look:-1,scale:L.sc,bob:Math.sin(t*4+1)*2});
    chip(KEEP[0]+' '+p2(KEEP[1])+' · used',x,L.rows[0],clamp((t-TR[0])/0.35)*chipOut,'#cfd3e0');
    UNUSED.forEach(([n,p],i)=>{const a=clamp((t-TR[i+1])/0.35)*chipOut,cut=t>TR[i+1]+0.45;chip(n+(cut?' · CANCELLED':' '+p2(p)),x,L.rows[i+1],a,cut?'#3ddc84':'#cfd3e0');});
    chip('= '+p2(MONTHLY)+' A MONTH KEPT',x,L.rows[5],clamp((t-TTOT)/0.35)*chipOut,'#3ddc84','#3ddc84');
    if(run&&!done)pop('+'+p2(MONTHLY),sx,FLOOR-val/UNIT*BH-(WIDE?30:44),ph*1.1,'#3ddc84',WIDE?28:36);
    text(big(val),x,FLOOR+L.lab[0],L.fs[0],'#3ddc84',{alpha:intro});
    text('KEPT',x,FLOOR+L.lab[1],L.fs[1],'#3ddc84',{spacing:3,alpha:intro});
    text(t<TR[1]?'Checks the bank app':'Cancels the 4 unused ones',x,FLOOR+L.lab[2],L.fs[2],'#8f95a6',{weight:700,spacing:1,alpha:intro});
  }
  // ---- header ----
  const hA=1-clamp((t-END)/0.4);
  if(hA>0){
    text('MONEY HACKS',W/2,L.head[0],L.hs,'#fff',{alpha:hA*clamp(t/0.4)});
    text('THE SUBSCRIPTION AUDIT',W/2,L.head[1],L.hs*(WIDE?1:0.86),YEL,{alpha:hA*clamp((t-0.3)/0.4)});
    if(!run){const s=t<TTOT?'Same 5 subscriptions. Only 1 gets used.':p2(MONTHLY)+' a month on things nobody uses';
      const a=t<TTOT?clamp((t-0.9)/0.4)*(1-clamp((t-TTOT+0.3)/0.3)):clamp((t-TTOT)/0.3)*(1-clamp((t-T0+0.3)/0.3));
      text(s,W/2,L.sub,L.subfs,'#9aa0b2',{weight:700,alpha:hA*a});}
    else if(!done){const a=hA*clamp((t-T0)/0.3);
      text('MONTH',W/2-35,L.sub,WIDE?28:30,'#9aa0b2',{align:'right',spacing:6,alpha:a});
      text(k+' OF 12',W/2-15,L.sub,WIDE?52:62,YEL,{align:'left',alpha:a});}
    else{const a=hA*clamp((t-T1)/0.3);text('One year: '+p2(YEAR)+' wasted vs kept',W/2,L.sub,L.subfs,'#cfd3e0',{weight:800,alpha:a});}
  }
  if(t>=END){const a=clamp((t-END-0.2)/0.4);
    L.end.forEach(([y,s],i)=>text(s,W/2,y,L.es,i===L.end.length-1?YEL:'#fff',{alpha:clamp((t-END-0.2-i*0.3)/0.4)}));
    text(p2(MONTHLY)+' a month = '+p2(YEAR)+' a year',W/2,L.end[L.end.length-1][0]+(WIDE?72:95),L.subfs,'#cfd3e0',{weight:800,alpha:a});
    const c=clamp((t-END-1.0)/0.4),C=L.cta;
    text(C.txt,C.tx,C.ty,C.ts,'#cfd3e0',{weight:700,alpha:c});
    if(c>0)for(const Bt of C.btn){const pressed=t>END+Bt.at-0.4,kk=clamp((t-END-Bt.at+0.4)/0.15),sq=1-0.08*Math.sin(Math.PI*kk);
      g.save();g.globalAlpha=c;g.translate(Bt.x,Bt.y);g.scale(sq,sq);g.fillStyle=pressed?'#2a2d35':Bt.col;rr(-Bt.w/2,-Bt.h/2,Bt.w,Bt.h,Bt.h/2);g.fill();g.restore();
      const lx=Bt.bell&&pressed?Bt.x+14:Bt.x;
      text(pressed?Bt.off:Bt.on,lx,Bt.y+1,C.bs*sq,pressed?'#fff':Bt.fg,{alpha:c});
      if(Bt.bell&&pressed)bell(Bt.x-Bt.w/2+34,Bt.y,C.bs*0.9,t-END-Bt.at+0.4,c);}
    const d1='Illustration only: example subscription prices. Check cancellation terms before you cancel.',d2='Not financial advice.';
    if(WIDE)text(d1+' '+d2,W/2,L.disc,L.ds,'#6f7486',{weight:500,alpha:a});
    else{text('Illustration only: example subscription prices.',W/2,L.disc,L.ds,'#6f7486',{weight:500,alpha:a});
      text('Check cancellation terms first. Not financial advice.',W/2,L.disc+30,L.ds,'#6f7486',{weight:500,alpha:a});}
  }
}
window.render=render;render(0);
</script></body></html>
